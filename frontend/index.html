<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JalaOps – huoltopyyntöjen hallinta</title>
    <meta name="description" content="JalaOps on demosovellus huoltopyyntöjen hallintaan: kirjaa, priorisoi ja seuraa pyyntöjä, näe ne kartalla ja lue tekoälyn tilannekatsaus. Toteutettu Laravelilla, Vuella ja MariaDB:llä.">
    <meta name="application-name" content="JalaOps">
    <meta name="author" content="Jussi Alanen">
    <meta name="keywords" content="huoltopyynnöt, kiinteistöhuolto, huoltopyyntöjen hallinta, kartta, tekoäly, Laravel, Vue, demosovellus">
    <!-- A demo application: keep it out of search engines. The tags below are for link previews when the address is shared. -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="%VITE_SITE_URL%/">

    <!-- Icons and the installable web app -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#f8fafc">
    <meta name="color-scheme" content="light dark">
    <meta name="format-detection" content="telephone=no">

    <!-- Open Graph (Facebook, LinkedIn, Slack, Teams, WhatsApp) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="JalaOps">
    <meta property="og:locale" content="fi_FI">
    <meta property="og:url" content="%VITE_SITE_URL%/">
    <meta property="og:title" content="JalaOps – huoltopyyntöjen hallinta">
    <meta property="og:description" content="Demosovellus huoltopyyntöjen hallintaan: pyynnöt, suodattimet, kartta ja tekoälyn tilannekatsaus. Laravel, Vue ja MariaDB.">
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="627">
    <meta property="og:image:alt" content="JalaOps: huoltopyyntöjen hallinta ja tekoälyn tilannekatsaus">

    <!-- X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="JalaOps – huoltopyyntöjen hallinta">
    <meta name="twitter:description" content="Demosovellus huoltopyyntöjen hallintaan: pyynnöt, suodattimet, kartta ja tekoälyn tilannekatsaus.">
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg">
    <meta name="twitter:image:alt" content="JalaOps: huoltopyyntöjen hallinta ja tekoälyn tilannekatsaus">

    <!-- Structured data: what the app is, for services that read it -->
    <!-- Loading screen, shown inside #app until Vue replaces it. Inline, so it
         appears before any JavaScript or stylesheet has loaded. -->
    <style>
      body { margin: 0; background: #f8fafc; }
      html.dark body { background: #020617; }
      .preloader {
        display: grid; place-items: center; align-content: center; gap: 18px;
        min-height: 100vh; min-height: 100dvh;
        font: 600 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #475569;
        /* Fades in after a moment, so a fast load doesn't flash it. */
        opacity: 0; animation: preloader-in 0.3s ease 0.15s forwards;
      }
      html.dark .preloader { color: #94a3b8; }
      .preloader-spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid #bae6fd; border-top-color: #0369a1;
        animation: preloader-spin 0.8s linear infinite;
      }
      html.dark .preloader-spinner { border-color: #064e3b; border-top-color: #34d399; }
      @keyframes preloader-in { to { opacity: 1; } }
      @keyframes preloader-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .preloader { animation: none; opacity: 1; }
        .preloader-spinner { animation: none; border-color: #0369a1; }
        html.dark .preloader-spinner { border-color: #34d399; }
      }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "JalaOps",
        "url": "%VITE_SITE_URL%/",
        "description": "Demosovellus huoltopyyntöjen hallintaan.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "fi",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "author": { "@type": "Person", "name": "Jussi Alanen" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <script>
      // Apply the saved or system theme before the app loads to avoid a flash
      // of the wrong theme. src/theme.js takes over once the app starts.
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        var dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="app">
      <div class="preloader" role="status">
        <img src="/favicon.svg" width="64" height="64" alt="">
        <div class="preloader-spinner" aria-hidden="true"></div>
        <span>Ladataan JalaOpsia…</span>
      </div>
    </div>
    <noscript>
      <p style="padding: 16px; font-family: system-ui, sans-serif; text-align: center;">JalaOps tarvitsee toimiakseen JavaScriptin. Ota se käyttöön selaimesi asetuksista.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
