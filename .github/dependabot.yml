# Monthly, grouped dependency updates to keep the noise low. Security fixes
# are opened separately as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: monthly
    groups:
      composer:
        patterns: ['*']
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/docker/backend, /docker/production]
    schedule:
      interval: monthly
