# Deploys the backend to Google Cloud Run when a push to main changes it, after
# the CI checks pass. Signs in with Workload Identity Federation, so no Google
# key is stored in GitHub. Needs the repository variables GCP_PROJECT_ID,
# GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT (see docs/DEPLOYMENT.md);
# without them the workflow is skipped.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  SERVICE: jalaops-backend
  REGION: europe-north1

jobs:
  ci:
    name: CI
    if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloud Run
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # Builds backend/Dockerfile with Cloud Build and deploys a new revision.
      # The service's other settings (instances, CPU, memory, environment
      # variables) stay as they were set by hand.
      - name: Deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: >
          gcloud run deploy "$SERVICE"
          --source backend
          --region "$REGION"
          --project "$PROJECT_ID"
          --quiet
