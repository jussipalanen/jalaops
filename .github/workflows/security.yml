# Security scanning. GitHub's code scanning and dependency review are free for
# public repositories only, so these jobs are skipped while the repository is private.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, to catch newly published vulnerabilities in unchanged code.
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # CodeQL has no PHP support; the backend is covered by Pint, tests and composer audit.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Block new dependencies with known vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
