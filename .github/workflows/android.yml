# Builds the Android app and attaches jalaops.apk (install on a phone),
# jalaops.aab (upload to Google Play) and their SHA256SUMS to each GitHub
# release, with a build provenance attestation that anyone can check with
# `gh attestation verify jalaops.apk -R jussipalanen/jalaops`. It can also be
# started by hand from the Actions tab; the files are then under the run's
# artifacts. Needs the upload key in secrets (./dev android-secrets).
name: Android

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  # For the build provenance attestation.
  id-token: write
  attestations: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # On a release, build the released commit.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Check the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The upload key is missing. Run ./dev android-secrets to store it in GitHub secrets."
            exit 1
          fi

      # Bubblewrap expects sdkmanager in <sdk>/bin (as its own installer lays it
      # out) and its build-tools version; the runner has sdkmanager in
      # cmdline-tools/latest/bin. Keep the versions in step with docker/android/Dockerfile.
      - name: Prepare the Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.1.0" > /dev/null
          [ -e "$ANDROID_HOME/bin" ] || ln -s cmdline-tools/latest/bin "$ANDROID_HOME/bin"
          [ -e "$ANDROID_HOME/lib" ] || ln -s cmdline-tools/latest/lib "$ANDROID_HOME/lib"

      # The runner image includes Java 17 and the Android SDK.
      - name: Build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Remove the key even if the build fails.
          trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks" JAVA_HOME="$JAVA_HOME_17_X64" scripts/android/build.sh

      - name: Checksums
        working-directory: android/dist
        run: sha256sum jalaops.apk jalaops.aab | tee SHA256SUMS

      # Signed proof that these files were built by this workflow from this
      # repository's source.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            android/dist/jalaops.apk
            android/dist/jalaops.aab

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" android/dist/jalaops.apk android/dist/jalaops.aab android/dist/SHA256SUMS --clobber

      - name: Upload as artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: jalaops-android
          path: android/dist/
