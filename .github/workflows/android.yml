# Builds the Android app and attaches jalaops.apk (install on a phone) and
# jalaops.aab (upload to Google Play) to each GitHub release. It can also be
# started by hand from the Actions tab; the files are then under the run's
# artifacts. Needs the upload key in secrets (./dev android-secrets).
name: Android

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # On a release, build the released commit.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Check the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The upload key is missing. Run ./dev android-secrets to store it in GitHub secrets."
            exit 1
          fi

      # The runner image includes Java 17 and the Android SDK.
      - name: Build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks" JAVA_HOME="$JAVA_HOME_17_X64" scripts/android/build.sh
          rm "$RUNNER_TEMP/upload.jks"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" android/dist/jalaops.apk android/dist/jalaops.aab --clobber

      - name: Upload as artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: jalaops-android
          path: android/dist/
